name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

# Least privilege: no job needs to write to the repository.
permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements-dev.txt
      - run: pip install ruff==0.8.6
      - run: ruff check src/console/backend/
      - run: ruff check tests/ scripts/
      - run: ruff format --check src/console/backend/
      - run: ruff format --check tests/ scripts/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r src/console/backend/requirements.txt
          pip install -r src/console/backend/requirements-dev.txt
      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          PYTHONPATH: src/console/backend
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/console/ -v --tb=short --cov=src/console/backend --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage.xml
          flags: backend

  backend-migrations:
    name: Backend Migrations (fresh DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civilpdf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r src/console/backend/requirements.txt
          pip install -r src/console/backend/requirements-dev.txt
      - name: Alembic upgrade head on empty SQLite DB
        working-directory: src/console/backend
        env:
          DATABASE_URL: sqlite:///./fresh_migration_ci.db
          PYTHONPATH: .
        run: alembic upgrade head
      - name: Verify SQLite schema parity with models
        working-directory: src/console/backend
        env:
          DATABASE_URL: sqlite:///./fresh_migration_ci.db
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from database import Base
          import models
          engine = create_engine(os.environ["DATABASE_URL"])
          insp = inspect(engine)
          model_tables = set(Base.metadata.tables)
          db_tables = set(insp.get_table_names())
          missing_tables = sorted(model_tables - db_tables)
          assert not missing_tables, f"Missing tables: {missing_tables}"
          missing_cols = {}
          for table in sorted(model_tables & db_tables):
              model_cols = set(Base.metadata.tables[table].columns.keys())
              db_cols = {c["name"] for c in insp.get_columns(table)}
              diff = sorted(model_cols - db_cols)
              if diff:
                  missing_cols[table] = diff
          assert not missing_cols, f"Missing columns: {missing_cols}"
          print(f"SQLite schema parity OK: {len(model_tables)} tables")
          PY
      - name: Alembic upgrade head on empty PostgreSQL DB
        working-directory: src/console/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civilpdf_test
          PYTHONPATH: .
        run: alembic upgrade head
      - name: Verify PostgreSQL schema parity with models
        working-directory: src/console/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civilpdf_test
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from database import Base
          import models
          engine = create_engine(os.environ["DATABASE_URL"])
          insp = inspect(engine)
          model_tables = set(Base.metadata.tables)
          db_tables = set(insp.get_table_names())
          missing_tables = sorted(model_tables - db_tables)
          assert not missing_tables, f"Missing tables: {missing_tables}"
          missing_cols = {}
          for table in sorted(model_tables & db_tables):
              model_cols = set(Base.metadata.tables[table].columns.keys())
              db_cols = {c["name"] for c in insp.get_columns(table)}
              diff = sorted(model_cols - db_cols)
              if diff:
                  missing_cols[table] = diff
          assert not missing_cols, f"Missing columns: {missing_cols}"
          print(f"PostgreSQL schema parity OK: {len(model_tables)} tables")
          PY
      - name: Verify PostgreSQL enum labels match model enums
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civilpdf_test
          PYTHONPATH: src/console/backend
        run: python -m pytest tests/console/test_enum_parity.py -v --tb=short

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r src/console/backend/requirements.txt

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          # Pinned release + checksum (from gitleaks_8.30.1_checksums.txt) so a
          # tampered download fails instead of running unverified code.
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.local/bin" -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run gitleaks detect
        run: gitleaks detect --source . --redact --verbose

  frontend-security:
    name: Frontend Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/console/frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  ops-checks:
    name: Ops Docs / Script / Version Sync Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bash scripts
        run: |
          for f in scripts/*.sh deploy/install-systemd.sh; do
            bash -n "$f"
          done
      - name: Run shellcheck (warning+)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh deploy/install-systemd.sh
      - name: Validate version sync
        run: ./scripts/verify-version-sync.sh
      - name: Verify docker compose definitions
        run: ./scripts/verify-compose.sh

  staging-compose-changes:
    name: Staging Compose Changes
    runs-on: ubuntu-latest
    # paths-filter is only meaningful for PR/push; merge_group skips this job,
    # which in turn skips the (non-required) smoke job below.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      staging: ${{ steps.filter.outputs.staging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            staging:
              - 'docker-compose.staging.yml'
              - 'docker-compose.prod.yml'
              - 'docker-compose.mvp.yml'
              - '.env.stg.example'
              - '.env.prod.example'
              - 'scripts/staging-smoke.py'
              - 'scripts/verify-compose.sh'
              - 'scripts/seed_demo_data.py'
              - 'src/console/backend/**'
              - 'src/console/frontend/Dockerfile.prod'
              - 'src/console/frontend/nginx.conf'
              - '.github/workflows/ci.yml'

  staging-compose-smoke:
    name: Staging Compose Smoke
    needs: staging-compose-changes
    if: needs.staging-compose-changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NON-REQUIRED check name: intentionally NOT added to the required-check
    # ruleset. It builds and boots the staging stack and runs the staging smoke,
    # so a broken docker-compose.staging.yml fails visibly without gating merges.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate throwaway staging env (.env.stg)
        run: |
          {
            echo "ENVIRONMENT=staging"
            echo "DEBUG=false"
            echo "POSTGRES_DB=civilpdf_stg"
            echo "POSTGRES_USER=civilpdf_stg"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "FRONTEND_PORT=18971"
            echo "UVICORN_WORKERS=2"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "ALGORITHM=HS256"
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=60"
            echo "REFRESH_TOKEN_EXPIRE_DAYS=7"
            echo "TIMESTAMP_HMAC_KEY=$(openssl rand -hex 32)"
            echo 'CORS_ORIGINS=["http://127.0.0.1:18971"]'
            echo "MAX_FILE_SIZE_MB=100"
          } > .env.stg
      - name: Build and start staging stack
        run: docker compose --env-file .env.stg -f docker-compose.staging.yml up -d --build
      - name: Wait for staging to become healthy
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18971/health >/dev/null 2>&1; then
              echo "staging healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "staging did not become healthy in time" >&2
          docker compose --env-file .env.stg -f docker-compose.staging.yml ps
          docker compose --env-file .env.stg -f docker-compose.staging.yml logs --tail=200
          exit 1
      - name: Install httpx
        run: pip install httpx
      - name: Run staging smoke
        env:
          BASE_URL: http://127.0.0.1:18971
        run: python scripts/staging-smoke.py
      - name: Tear down staging stack
        if: always()
        run: docker compose --env-file .env.stg -f docker-compose.staging.yml down -v

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/console/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/console/frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/console/frontend/playwright-report/
          retention-days: 7

  integration-test:
    name: API Integration Tests (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r src/console/backend/requirements.txt
          pip install -r src/console/backend/requirements-dev.txt
      - name: Run integration tests
        env:
          DATABASE_URL: sqlite:///./test_ci_integration.db
          PYTHONPATH: src/console/backend
        run: python -m pytest tests/integration/ -v --tb=short

  # Windows 11 互換性確認ジョブ
  # pathlib.Path 統一化 + database.py SQLite/PostgreSQL 分岐を検証
  backend-test-windows:
    name: Backend Tests (Windows 11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r src/console/backend/requirements.txt
          pip install -r src/console/backend/requirements-dev.txt
      - name: Run tests on Windows
        env:
          DATABASE_URL: sqlite:///./test_windows.db
          PYTHONPATH: src/console/backend
        run: python -m pytest tests/console/ -v --tb=short -x
        shell: pwsh

  frontend-build-windows:
    name: Frontend Build (Windows 11)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/console/frontend/package-lock.json
      - run: npm ci
        shell: pwsh
      - run: npm run build
        shell: pwsh
